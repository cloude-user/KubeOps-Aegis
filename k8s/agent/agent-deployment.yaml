# ============================================================
# KubeOps-Aegis Autonomous SRE AI Agent: Kubernetes Deployment
# Namespace, ServiceAccount (Workload Identity), RBAC & Deployment
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kubeops-system
  labels:
    name: kubeops-system
    control-plane: aegis-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-agent-sa
  namespace: kubeops-system
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000" # Azure User-Assigned Managed Identity Client ID
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-agent-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch", "delete", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-agent-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: aegis-agent-sa
    namespace: kubeops-system
roleRef:
  kind: ClusterRole
  name: aegis-agent-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-aegis-agent
  namespace: kubeops-system
  labels:
    app: kubeops-aegis-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeops-aegis-agent
  template:
    metadata:
      labels:
        app: kubeops-aegis-agent
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: aegis-agent-sa
      containers:
        - name: aegis-agent
          image: kubeopsaegisacrprd.azurecr.io/kubeops-aegis-agent:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "prd"
            - name: KUBERNETES_IN_CLUSTER
              value: "true"
            - name: AZURE_KEYVAULT_URL
              value: "https://kubeops-aegis-kv-prd.vault.azure.net/"
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "kubeopsaegisstprd"
            - name: AZURE_STORAGE_CONTAINER
              value: "incident-logs"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-aegis-agent-service
  namespace: kubeops-system
  labels:
    app: kubeops-aegis-agent
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: kubeops-aegis-agent
