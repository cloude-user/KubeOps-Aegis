# ============================================================
# 3-Tier App Tier 3: PostgreSQL Database StatefulSet & Secret
# Persistent storage on Azure Managed Disks
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: app-prod
type: Opaque
stringData:
  POSTGRES_DB: orderdb
  POSTGRES_USER: orderuser
  POSTGRES_PASSWORD: P@ssw0rdOrderDB2026!
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: app-prod
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: app-prod
  labels:
    app: postgres
    tier: database
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "managed-csi" # Azure Disk CSI Driver
        resources:
          requests:
            storage: 10Gi
