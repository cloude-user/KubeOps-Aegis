# ============================================================
# HorizontalPodAutoscaler (HPA v2) for Backend Microservice
# Auto-scales backend-api pods from 1 to 4 based on CPU load (> 75%)
# Tested via POST /api/v1/chaos/cpu-burn
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-hpa
  namespace: aegis-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
