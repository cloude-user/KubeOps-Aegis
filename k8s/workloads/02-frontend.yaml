# ============================================================
# KubeOps-Aegis: Frontend UI Microservice Kubernetes Manifest
# Includes Deployment, Public LoadBalancer Service & Health Probes
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: aegis-apps
  labels:
    app: frontend-ui
    tier: frontend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
        tier: frontend
    spec:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend-ui
          image: kubeopsaegisacrprd.azurecr.io/frontend-ui:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: aegis-apps
  labels:
    app: frontend-ui
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend-ui
