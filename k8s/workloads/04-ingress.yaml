# ============================================================
# KubeOps-Aegis: Ingress Manifest (Layer-7 Reverse Proxy)
# Routes traffic through an Ingress Controller (NGINX / AGIC)
# Single Public LoadBalancer IP -> Path routing:
#   - /api/* -> backend-service (ClusterIP:80 -> Pod:8000)
#   - /*     -> frontend-service (ClusterIP:80 -> Pod:80)
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-commerce-ingress
  namespace: aegis-apps
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
