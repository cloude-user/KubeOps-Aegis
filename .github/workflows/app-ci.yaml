name: Application CI & ACR Container Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'agent/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/app-ci.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'agent/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/app-ci.yaml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Tag for ACR Docker Image'
        required: false
        default: 'latest'

permissions:
  id-token: write # Required for Azure Entra ID OIDC
  contents: read
  security-events: write

jobs:
  # ============================================================
  # JOB 1: PYTHON CODE QUALITY, LINT & UNIT TESTS
  # ============================================================
  code-quality:
    name: 🐍 Python Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pytest-asyncio
          pip install -r agent/requirements.txt

      - name: 🔍 Python Code Format Check (Black)
        run: |
          black --check agent/

      - name: 🛡️ Python Syntax & Style Lint (Flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 agent/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 agent/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Run Unit Tests (Pytest)
        run: |
          pytest --verbose agent/

  # ============================================================
  # JOB 2: DOCKER SECURITY SCAN & ACR PUSH
  # ============================================================
  docker-ci:
    name: 🐳 Docker Lint, Security Scan & ACR Push
    needs: code-quality
    runs-on: ubuntu-latest
    env:
      ACR_NAME: "kubeopsaegisacrprd"
      IMAGE_NAME: "kubeops-aegis-agent"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013 # Allow unpinned apt-get / pip packages for dynamic updates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }} || echo "ACR login skipped (will push when ACR is provisioned)"

      - name: 🏗️ Build Local Docker Image for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-scan

      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:test-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🚀 Build & Push Image to Azure Container Registry (ACR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:v2.0.0
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}
