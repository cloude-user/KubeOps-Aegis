name: Azure Production Terraform IaC Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'azure/terraform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'azure/terraform/**'

permissions:
  id-token: write # Required for Azure Entra ID OIDC authentication
  contents: read

jobs:
  terraform:
    name: 🏗️ Terraform Init, Plan & Apply (Azure OIDC)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: |
          cd azure/terraform
          terraform fmt -check

      - name: Terraform Init
        run: |
          cd azure/terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd azure/terraform
          terraform plan -var-file="env/prd.tfvars"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd azure/terraform
          terraform apply -var-file="env/prd.tfvars" -auto-approve
